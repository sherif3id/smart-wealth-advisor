services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_wealth
      POSTGRES_USER: wealth_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wealth_app -d smart_wealth"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - wealth_postgres:/var/lib/postgresql/data

  ml-service:
    build: ./ml-service
    restart: unless-stopped
    environment:
      APP_ENV: development
      ML_ALLOW_SYNTHETIC_DEMO: "true"
    expose:
      - "8001"
    volumes:
      - ./ml-service/models:/app/models
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/live', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://wealth_app:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/smart_wealth
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-smart-wealth-core}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-smart-wealth-bff}
      ML_SERVICE_URL: http://ml-service:8001
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      TRUST_PROXY_HEADERS: "true"
      AUTO_CREATE_TABLES: "false"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      NOTIFICATION_FROM: ${NOTIFICATION_FROM:-Smart Wealth Advisor <no-reply@example.com>}
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET is required}
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  frontend:
    build: .
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODELS: ${GEMINI_MODELS:-gemini-3.8-flash,gemini-3.5-flash-lite,gemini-2.5-flash}
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET is required}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  wealth_postgres: